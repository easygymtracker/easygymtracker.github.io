<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #111827; stroke-width: 2; rx: 10; ry: 10; }
      .title { font: 700 18px system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111827; }
      .text { font: 14px system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111827; }
      .muted { fill: #374151; font: 13px system-ui, -apple-system, Segoe UI, Roboto, Arial; }
      .arrow { stroke: #111827; stroke-width: 2.2; fill: none; marker-end: url(#arrowHead); }
      .dashed { stroke-dasharray: 6 6; }
      .label { font: 12px system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #374151; }
    </style>

    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#111827"></path>
    </marker>
  </defs>

  <!-- Exercise -->
  <rect class="box" x="70" y="70" width="320" height="150"/>
  <text class="title" x="90" y="105">Exercise</text>
  <text class="text" x="90" y="135">id</text>
  <text class="text" x="90" y="160">description</text>
  <text class="muted" x="90" y="195">Only shared entity</text>

  <!-- ProfileEntry -->
  <rect class="box" x="70" y="260" width="320" height="190"/>
  <text class="title" x="90" y="295">ProfileEntry</text>
  <text class="text" x="90" y="325">id</text>
  <text class="text" x="90" y="350">recordedAt</text>
  <text class="text" x="90" y="375">weightKg?</text>
  <text class="text" x="90" y="400">bodyFatPct?</text>
  <text class="text" x="90" y="425">muscleKg?</text>
  <text class="muted" x="90" y="445">Used for bodyweight snapshot</text>

  <!-- Routine -->
  <rect class="box" x="470" y="50" width="360" height="220"/>
  <text class="title" x="490" y="85">Routine</text>
  <text class="text" x="490" y="115">id</text>
  <text class="text" x="490" y="140">name</text>
  <text class="text" x="490" y="165">description</text>
  <text class="text" x="490" y="190">series: SetSeries[]</text>
  <text class="muted" x="490" y="220">(ordered sequence)</text>

  <!-- SetSeries -->
  <rect class="box" x="980" y="80" width="360" height="210"/>
  <text class="title" x="1000" y="115">SetSeries (Series)</text>
  <text class="text" x="1000" y="145">id</text>
  <text class="text" x="1000" y="170">description</text>
  <text class="text" x="1000" y="195">exerciseId ? Exercise.id</text>
  <text class="text" x="1000" y="220">repGroups: RepGroup[]</text>
  <text class="text" x="1000" y="245">restSecondsAfter</text>
  <text class="muted" x="1000" y="275">(rest after finishing this SetSeries)</text>

  <!-- RepGroup -->
  <rect class="box" x="980" y="340" width="360" height="260"/>
  <text class="title" x="1000" y="375">RepGroup</text>
  <text class="text" x="1000" y="405">id</text>
  <text class="text" x="1000" y="430">exerciseId ? Exercise.id</text>
  <text class="text" x="1000" y="455">laterality (uni/bi)</text>
  <text class="text" x="1000" y="480">targetReps? (int | {left,right})</text>
  <text class="text" x="1000" y="505">targetWeight? (number | {left,right})</text>
  <text class="text" x="1000" y="530">restSecondsAfter</text>
  <text class="text" x="1000" y="555">history: RepGroupHistoryEntry[]</text>
  <text class="muted" x="1000" y="585">(rest after finishing this RepGroup)</text>

  <!-- RepGroupHistoryEntry -->
  <rect class="box" x="980" y="650" width="360" height="170"/>
  <text class="title" x="1000" y="685">RepGroupHistoryEntry</text>
  <text class="text" x="1000" y="715">dateTime (ISO 8601 key)</text>
  <text class="text" x="1000" y="740">reps: int | {left,right}</text>
  <text class="text" x="1000" y="765">weight: null | number | {left,right}</text>
  <text class="muted" x="1000" y="795">Used to compute stats and PRs</text>

  <!-- WorkoutSession -->
  <rect class="box" x="470" y="560" width="470" height="320"/>
  <text class="title" x="490" y="595">WorkoutSession</text>
  <text class="text" x="490" y="625">id</text>
  <text class="text" x="490" y="650">routineId, routineName</text>
  <text class="text" x="490" y="675">date, startedAt, endedAt</text>
  <text class="text" x="490" y="700">durationMs</text>
  <text class="text" x="490" y="725">sessionNotes</text>
  <text class="text" x="490" y="750">rpe (0..10 | null)</text>
  <text class="text" x="490" y="775">bodyweightKg (snapshot | null)</text>
  <text class="text" x="490" y="800">totals {sets,reps,volume,exercises}</text>
  <text class="text" x="490" y="825">exerciseBreakdown[]</text>
  <text class="text" x="490" y="850">prDetection {totalPrs, byExercise[]}</text>
  <text class="muted" x="490" y="872">Persisted when workout session ends</text>

  <!-- Ownership arrows (solid) -->
  <path class="arrow" d="M830 150 L980 170"/>
  <text class="label" x="875" y="145">owns</text>

  <path class="arrow" d="M1160 290 L1160 340"/>
  <text class="label" x="1172" y="320">owns</text>

  <path class="arrow" d="M1160 600 L1160 650"/>
  <text class="label" x="1172" y="628">owns</text>

  <!-- Reference arrows to Exercise (dashed) -->
  <path class="arrow dashed" d="M980 195 C760 190, 520 190, 390 160"/>
  <text class="label" x="700" y="175">references by exerciseId</text>

  <path class="arrow dashed" d="M980 430 C780 420, 520 290, 390 160"/>
  <text class="label" x="735" y="395">references by exerciseId</text>

  <!-- WorkoutSession references/derivations -->
  <path class="arrow dashed" d="M700 560 L700 270"/>
  <text class="label" x="712" y="430">references routineId</text>

  <path class="arrow dashed" d="M470 760 C300 760, 220 540, 230 450"/>
  <text class="label" x="235" y="730">bodyweight snapshot from latest profile entry</text>

  <path class="arrow dashed" d="M940 760 C1010 760, 1040 760, 1090 760"/>
  <text class="label" x="945" y="742">PR/statistics derived from history entries</text>

  <!-- Legend -->
  <rect class="box" x="70" y="500" width="390" height="220"/>
  <text class="title" x="90" y="535">Legend</text>

  <line x1="90" y1="560" x2="210" y2="560" class="arrow"/>
  <text class="text" x="225" y="565">owns (composition)</text>

  <line x1="90" y1="595" x2="210" y2="595" class="arrow dashed"/>
  <text class="text" x="225" y="600">references (by id)</text>

  <line x1="90" y1="630" x2="210" y2="630" class="arrow dashed"/>
  <text class="text" x="225" y="635">derived snapshot/calculated value</text>

  <text class="muted" x="90" y="680">RepGroup is owned by a routine (not shared across routines).</text>
  <text class="muted" x="90" y="705">WorkoutSession is an immutable log record written when a session ends.</text>
</svg>